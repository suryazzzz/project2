<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SRITHI THE COUTURE — Contemporary Fashion Studio</title>
  <meta name="description" content="Srithi The Couture — Premium Indian ethnic fashion studio. Discover curated Sarees and Salwar Sets crafted for your most memorable moments." />
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&display=swap" rel="stylesheet" />
  <style>
:root{--ivory:#F7F3EC;--ivory-2:#EDE8DF;--sand:#D9CFC0;--charcoal:#1C1C1C;--charcoal-2:#2E2E2E;--terracotta:#B5573A;--terra-lt:#D4724E;--terra-pale:#F5E6DF;--beige:#E8DFD0;--warm-gray:#7A746C;--mid-gray:#4A4440;--white:#FFFFFF}
.header-logo{height:38px;width:auto;display:block;filter:brightness(0);transition:filter .25s,opacity .2s;object-fit:contain}
.header-logo:hover{filter:brightness(0) invert(35%) sepia(60%) saturate(600%) hue-rotate(340deg) brightness(85%)}
.mobile-logo{height:30px;width:auto;filter:brightness(0)}
@keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
.img-shimmer{position:absolute;inset:0;background:linear-gradient(90deg,var(--beige) 25%,var(--ivory-2) 50%,var(--beige) 75%);background-size:800px 100%;animation:shimmer 1.4s infinite linear;z-index:1}
.img-loaded .img-shimmer{display:none}
.prod-img-wrap{position:relative;width:100%;height:100%;overflow:hidden}
.prod-img-wrap img{position:relative;z-index:2;width:100%;height:100%;object-fit:cover;object-position:top center;transition:transform .6s cubic-bezier(.25,.46,.45,.94),filter .4s ease;filter:brightness(.97) saturate(1.05)}
.prod-img-wrap:hover img{transform:scale(1.07);filter:brightness(1) saturate(1.12)}
.prod-img-vignette{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 55%,rgba(28,28,28,.18) 100%);z-index:3;pointer-events:none;opacity:0;transition:opacity .3s}
.prod-card:hover .prod-img-vignette,.grid-prod-card:hover .prod-img-vignette{opacity:1}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--ivory);color:var(--charcoal);min-height:100vh}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:var(--ivory)}::-webkit-scrollbar-thumb{background:var(--terracotta);border-radius:4px}
.announcement-bar{background:var(--charcoal);color:var(--ivory);text-align:center;font-size:11px;letter-spacing:.12em;padding:8px 16px;font-family:'DM Sans',sans-serif;font-weight:500;text-transform:uppercase}
.site-header{position:sticky;top:0;z-index:900;background:var(--ivory);border-bottom:1px solid var(--sand)}
.header-inner{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;max-width:1440px;margin:0 auto;padding:0 32px;height:64px;gap:16px}
.header-brand{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:17px;letter-spacing:.14em;text-transform:uppercase;color:var(--charcoal);text-decoration:none;white-space:nowrap}
.header-nav{display:flex;align-items:center;gap:32px}
.header-nav a{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mid-gray);text-decoration:none;font-weight:500;transition:color .2s;position:relative}
.header-nav a::after{content:'';position:absolute;left:0;bottom:-2px;width:0;height:1px;background:var(--terracotta);transition:width .25s}
.header-nav a:hover{color:var(--terracotta)}.header-nav a:hover::after{width:100%}
.header-actions{display:flex;align-items:center;gap:20px;justify-content:flex-end}
.header-actions button,.header-actions a{background:none;border:none;cursor:pointer;color:var(--mid-gray);transition:color .2s;display:flex;align-items:center;position:relative;text-decoration:none}
.header-actions button:hover,.header-actions a:hover{color:var(--terracotta)}
.badge-count{position:absolute;top:-6px;right:-6px;background:var(--terracotta);color:var(--white);font-size:9px;font-weight:700;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.menu-toggle{display:none;flex-direction:column;gap:5px;background:none;border:none;cursor:pointer;padding:4px}
.menu-toggle span{display:block;width:22px;height:1.5px;background:var(--charcoal);transition:all .3s}
.search-overlay{position:fixed;inset:0;background:rgba(28,28,28,.96);z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px;animation:fadeOverlay .2s ease}
@keyframes fadeOverlay{from{opacity:0}to{opacity:1}}
.search-overlay h2{font-family:'Cormorant Garamond',serif;color:var(--ivory);font-size:clamp(20px,4vw,36px);letter-spacing:.06em;margin-bottom:32px;font-weight:400}
.search-input-wrap{width:100%;max-width:640px;border-bottom:1px solid rgba(247,243,236,.4);display:flex;align-items:center;gap:12px;padding-bottom:12px}
.search-input-wrap input{flex:1;background:none;border:none;outline:none;font-family:'Cormorant Garamond',serif;font-size:clamp(22px,4vw,40px);color:var(--ivory);font-weight:300}
.search-input-wrap input::placeholder{color:rgba(247,243,236,.3)}
.search-trending{margin-top:32px;text-align:center}
.search-trending p{color:rgba(247,243,236,.5);font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:12px}
.search-trending-tags{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.search-trending-tags button{background:rgba(247,243,236,.08);border:1px solid rgba(247,243,236,.15);color:rgba(247,243,236,.7);padding:6px 16px;font-size:12px;cursor:pointer;transition:all .2s;font-family:'DM Sans',sans-serif}
.search-trending-tags button:hover{background:var(--terracotta);border-color:var(--terracotta);color:var(--white)}
.search-close{position:absolute;top:24px;right:24px;background:none;border:none;cursor:pointer;color:rgba(247,243,236,.6)}
.cart-backdrop{position:fixed;inset:0;background:rgba(28,28,28,.4);z-index:980;animation:fadeOverlay .2s ease}
.cart-drawer{position:fixed;top:0;right:0;width:min(440px,100vw);height:100vh;background:var(--ivory);z-index:990;display:flex;flex-direction:column;animation:slideInRight .3s cubic-bezier(.4,0,.2,1)}
@keyframes slideInRight{from{transform:translateX(100%)}to{transform:translateX(0)}}
.cart-header{padding:24px 24px 16px;border-bottom:1px solid var(--sand);display:flex;align-items:center;justify-content:space-between}
.cart-header h2{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:500;letter-spacing:.06em}
.cart-items{flex:1;overflow-y:auto;padding:16px 24px}
.cart-item{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--beige)}
.cart-item-img{width:80px;height:100px;object-fit:cover;object-position:top;background:var(--beige);flex-shrink:0}
.cart-item-info{flex:1;min-width:0}
.cart-item-name{font-size:13px;font-weight:500;line-height:1.4;margin-bottom:4px}
.cart-item-meta{font-size:11px;color:var(--warm-gray);margin-bottom:10px}
.cart-item-price{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:600;color:var(--terracotta)}
.cart-qty{display:flex;align-items:center;gap:10px;margin-top:8px}
.cart-qty button{width:26px;height:26px;border:1px solid var(--sand);background:none;cursor:pointer;font-size:14px;font-weight:600;color:var(--charcoal);display:flex;align-items:center;justify-content:center;transition:all .15s}
.cart-qty button:hover{background:var(--charcoal);color:var(--ivory);border-color:var(--charcoal)}
.cart-qty span{font-size:13px;font-weight:600;width:24px;text-align:center}
.cart-remove{background:none;border:none;cursor:pointer;color:var(--warm-gray);align-self:flex-start;padding:4px;transition:color .2s}
.cart-remove:hover{color:var(--terracotta)}
.cart-footer{padding:16px 24px 24px;border-top:1px solid var(--sand)}
.cart-summary-row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px;color:var(--warm-gray)}
.cart-summary-row.total{font-size:16px;font-weight:600;color:var(--charcoal);border-top:1px solid var(--sand);padding-top:12px;margin-top:4px}
.cart-summary-row .green{color:#3a7d44}
.cart-free-ship{font-size:11px;color:var(--warm-gray);text-align:center;margin-bottom:12px}
.btn-terra{background:var(--terracotta);color:var(--white);border:none;padding:14px 32px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:600;transition:background .2s,transform .15s;display:inline-block;text-decoration:none;text-align:center}
.btn-terra:hover{background:var(--terra-lt);transform:translateY(-1px)}
.btn-outline-dark{background:none;color:var(--charcoal);border:1px solid var(--charcoal);padding:13px 32px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:600;transition:all .2s;display:inline-block;text-decoration:none;text-align:center}
.btn-outline-dark:hover{background:var(--charcoal);color:var(--ivory)}
.btn-outline-ivory{background:none;color:var(--ivory);border:1px solid rgba(247,243,236,.6);padding:13px 32px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:600;transition:all .2s;display:inline-block;text-decoration:none}
.btn-outline-ivory:hover{background:rgba(247,243,236,.1);border-color:var(--ivory)}
.btn-full{width:100%;display:block}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:9999;background:var(--charcoal);color:var(--ivory);padding:12px 28px;font-size:13px;font-family:'DM Sans',sans-serif;box-shadow:0 8px 32px rgba(0,0,0,.2);animation:toastIn .3s ease;white-space:nowrap}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(12px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.page-fade{animation:pageFade .35s ease}
@keyframes pageFade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.hero-split{display:grid;grid-template-columns:1fr 1fr;min-height:calc(100vh - 88px);max-height:900px}
.hero-text-col{display:flex;flex-direction:column;justify-content:center;padding:clamp(32px,6vw,96px);background:var(--ivory)}
.hero-eyebrow{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--terracotta);font-weight:600;margin-bottom:28px}
.hero-headline{font-family:'Cormorant Garamond',serif;font-size:clamp(48px,7vw,96px);font-weight:500;line-height:.95;letter-spacing:-.02em;color:var(--charcoal);margin-bottom:32px}
.hero-headline span{display:block;font-style:italic;color:var(--terracotta)}
.hero-sub{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--warm-gray);margin-bottom:16px}
.hero-desc{font-size:15px;line-height:1.7;color:var(--mid-gray);max-width:380px;margin-bottom:40px}
.hero-image-col{position:relative;overflow:hidden;background:var(--beige)}
.hero-image-col img{width:100%;height:100%;object-fit:cover;object-position:top;animation:zoomIn 8s ease-out forwards}
@keyframes zoomIn{from{transform:scale(1.06)}to{transform:scale(1)}}
.hero-label{position:absolute;bottom:32px;left:28px;background:rgba(247,243,236,.92);padding:8px 14px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--charcoal);font-weight:600}
.section-eyebrow{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--terracotta);font-weight:600;margin-bottom:12px}
.section-title-xl{font-family:'Cormorant Garamond',serif;font-size:clamp(36px,5vw,72px);font-weight:500;letter-spacing:-.01em;line-height:1;color:var(--charcoal)}
.section-title-lg{font-family:'Cormorant Garamond',serif;font-size:clamp(28px,4vw,54px);font-weight:500;letter-spacing:-.01em;line-height:1.1;color:var(--charcoal)}
.mood-section{padding:96px clamp(20px,4vw,80px);background:var(--ivory-2)}
.mood-header{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:48px;gap:16px;flex-wrap:wrap}
.mood-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.mood-card{position:relative;overflow:hidden;aspect-ratio:3/4;cursor:pointer;background:var(--beige);text-decoration:none;display:block}
.mood-card img{width:100%;height:100%;object-fit:cover;object-position:top;transition:transform .7s ease}
.mood-card:hover img{transform:scale(1.06)}
.mood-card-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(28,28,28,.75) 0%,rgba(28,28,28,.1) 60%,transparent 100%)}
.mood-card-content{position:absolute;bottom:0;left:0;right:0;padding:20px 16px;color:var(--ivory)}
.mood-card-tag{font-size:9px;letter-spacing:.2em;text-transform:uppercase;opacity:.7;margin-bottom:4px}
.mood-card-title{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:500}
.carousel-section{padding:80px 0 80px clamp(20px,4vw,80px)}
.carousel-header{display:flex;align-items:flex-end;justify-content:space-between;padding-right:clamp(20px,4vw,80px);margin-bottom:40px;gap:16px;flex-wrap:wrap}
.carousel-track{display:flex;gap:20px;overflow-x:auto;padding-right:clamp(20px,4vw,80px);scrollbar-width:none}
.carousel-track::-webkit-scrollbar{display:none}
.prod-card{flex-shrink:0;width:280px;background:var(--white);cursor:pointer;position:relative;overflow:hidden}
.prod-card-img{width:100%;aspect-ratio:3/4;overflow:hidden;background:var(--beige);position:relative}
.prod-card-img img{width:100%;height:100%;object-fit:cover;object-position:top;transition:transform .5s ease}
.prod-card:hover .prod-card-img img{transform:scale(1.05)}
.prod-card-hover{position:absolute;inset:0;background:rgba(28,28,28,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;opacity:0;transition:opacity .25s}
.prod-card:hover .prod-card-hover{opacity:1}
.prod-card-hover-btn{background:var(--ivory);color:var(--charcoal);border:none;padding:9px 22px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s;min-width:130px;text-align:center;text-decoration:none;display:block}
.prod-card-hover-btn:hover{background:var(--terracotta);color:var(--white)}
.prod-card-wish{position:absolute;top:12px;right:12px;background:var(--white);width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;box-shadow:0 2px 8px rgba(0,0,0,.1);transition:all .2s;z-index:2}
.prod-card-wish:hover,.prod-card-wish.active{background:var(--terracotta);color:var(--white)}
.prod-card-info{padding:14px 16px}
.prod-card-name{font-size:13px;font-weight:500;line-height:1.4;margin-bottom:4px;color:var(--charcoal)}
.prod-card-fabric{font-size:11px;color:var(--warm-gray);margin-bottom:8px}
.prod-card-price{font-family:'Cormorant Garamond',serif;font-size:19px;font-weight:600;color:var(--terracotta)}
.prod-card-orig{font-size:12px;color:var(--warm-gray);text-decoration:line-through;margin-left:6px;font-family:'DM Sans',sans-serif}
.prod-card-badge{position:absolute;top:12px;left:12px;font-size:9px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;padding:4px 8px;z-index:2}
.badge-new-v2{background:var(--charcoal);color:var(--ivory)}.badge-best-v2{background:var(--terracotta);color:var(--white)}.badge-off-v2{background:var(--ivory);color:var(--charcoal);border:1px solid var(--sand)}
.size-label{font-size:10px;color:var(--warm-gray);margin-top:4px}
.saree-edit-section{display:grid;grid-template-columns:1fr 1fr;min-height:600px;background:var(--charcoal)}
.saree-edit-img{overflow:hidden}.saree-edit-img img{width:100%;height:100%;object-fit:cover;object-position:top}
.saree-edit-text{display:flex;flex-direction:column;justify-content:center;padding:clamp(32px,6vw,96px);color:var(--ivory)}
.saree-edit-text .section-title-xl{color:var(--ivory)}
.saree-edit-desc{font-size:15px;line-height:1.75;color:rgba(247,243,236,.6);max-width:400px;margin:20px 0 36px}
.salwar-edit-section{padding:96px clamp(20px,4vw,80px);background:var(--terra-pale)}
.salwar-edit-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:center}
.salwar-img-collage{display:grid;grid-template-columns:1.3fr 1fr;grid-template-rows:auto auto;gap:12px}
.salwar-img-main{grid-row:span 2;aspect-ratio:3/5;overflow:hidden;background:var(--beige)}
.salwar-img-main img,.salwar-img-small img{width:100%;height:100%;object-fit:cover;object-position:top}
.salwar-img-small{aspect-ratio:4/3;overflow:hidden;background:var(--beige)}
.salwar-edit-text{padding:0 0 0 24px}
.salwar-edit-title{font-family:'Cormorant Garamond',serif;font-size:clamp(36px,5vw,64px);font-weight:500;line-height:.95;color:var(--charcoal);margin-bottom:8px}
.salwar-edit-tagline{font-size:15px;font-style:italic;color:var(--terracotta);font-family:'Cormorant Garamond',serif;margin-bottom:20px}
.salwar-edit-desc{font-size:14px;line-height:1.75;color:var(--mid-gray);margin-bottom:32px}
.most-loved-section{padding:96px clamp(20px,4vw,80px);background:var(--ivory)}
.most-loved-grid{display:flex;flex-direction:column;margin-top:48px}
.loved-card{display:grid;grid-template-columns:120px 1fr auto;align-items:center;gap:24px;padding:20px 0;border-bottom:1px solid var(--sand);cursor:pointer;text-decoration:none;color:var(--charcoal);transition:background .15s}
.loved-card:hover{background:rgba(217,207,192,.15)}
.loved-card-img{width:120px;height:150px;object-fit:cover;object-position:top;background:var(--beige);flex-shrink:0}
.loved-card-name{font-family:'Cormorant Garamond',serif;font-size:19px;font-weight:500;margin-bottom:4px;line-height:1.3}
.loved-card-meta{font-size:12px;color:var(--warm-gray)}
.loved-card-price{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:600;color:var(--terracotta);white-space:nowrap}
.just-in-section{padding:80px clamp(20px,4vw,80px);background:var(--charcoal-2)}
.just-in-header .section-title-xl{color:var(--ivory)}.just-in-header .section-eyebrow{color:var(--terra-lt)}
.just-in-grid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:16px;margin-top:40px}
.just-in-card{position:relative;overflow:hidden;background:var(--beige);cursor:pointer;text-decoration:none;display:block}
.just-in-card.large{grid-row:span 2;aspect-ratio:3/4}.just-in-card.medium{aspect-ratio:4/5}
.just-in-card img{width:100%;height:100%;object-fit:cover;object-position:top;transition:transform .6s ease}
.just-in-card:hover img{transform:scale(1.04)}
.just-in-card-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(28,28,28,.8) 0%,transparent 60%)}
.just-in-card-info{position:absolute;bottom:0;left:0;right:0;padding:20px;color:var(--ivory)}
.just-in-badge{font-size:9px;letter-spacing:.2em;text-transform:uppercase;background:var(--terracotta);display:inline-block;padding:3px 8px;margin-bottom:8px}
.just-in-name{font-family:'Cormorant Garamond',serif;font-size:17px;font-weight:500;line-height:1.3;margin-bottom:4px}
.just-in-price{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:600;color:var(--terra-lt)}
.brand-story{padding:120px clamp(20px,4vw,80px);background:var(--ivory-2);display:grid;grid-template-columns:1fr 1fr;gap:80px;align-items:center}
.brand-story-text .section-title-xl{margin-bottom:24px}
.brand-story-text .section-title-xl em{font-style:italic;color:var(--terracotta)}
.brand-story-body{font-size:16px;line-height:1.8;color:var(--mid-gray);font-family:'Cormorant Garamond',serif}
.brand-story-img{aspect-ratio:4/5;overflow:hidden;background:var(--beige)}
.brand-story-img img{width:100%;height:100%;object-fit:cover;object-position:top}
.collection-strip{display:flex;overflow-x:auto;background:var(--charcoal);scrollbar-width:none}
.collection-strip::-webkit-scrollbar{display:none}
.strip-item{flex-shrink:0;min-width:25%;padding:64px 40px;border-right:1px solid rgba(247,243,236,.1);cursor:pointer;text-decoration:none;display:block}
.strip-item-title{font-family:'Cormorant Garamond',serif;font-size:clamp(28px,4vw,60px);font-weight:500;color:rgba(247,243,236,.25);transition:color .25s;display:block;white-space:nowrap}
.strip-item:hover .strip-item-title{color:var(--ivory)}
.strip-item-arrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--terracotta);opacity:0;transition:opacity .25s;margin-top:6px;display:block}
.strip-item:hover .strip-item-arrow{opacity:1}
.promo-section{padding:96px clamp(20px,4vw,80px);background:var(--terracotta);display:grid;grid-template-columns:1fr auto;align-items:center;gap:40px}
.promo-headline{font-family:'Cormorant Garamond',serif;font-size:clamp(32px,5vw,72px);font-weight:500;color:var(--ivory);line-height:1}

.mobile-nav-overlay{position:fixed;inset:0;background:rgba(28,28,28,.4);z-index:950}

function SearchOverlay({onClose,onSearch}){

function CartDrawer({cart,updateQty,removeFromCart,onClose}){
  const sub=cart.reduce((s,i)=>s+i.price*i.qty,0);
  const disc=cart.reduce((s,i)=>s+i.originalPrice*i.qty,0)-sub;
  const del=sub>=999?0:79;
  return(<><div className="cart-backdrop" onClick={onClose}/>
    <div className="cart-drawer" role="dialog">
      <div className="cart-header"><h2>Your Bag <span style={{fontSize:14,fontWeight:400,color:'var(--warm-gray)',fontFamily:'DM Sans,sans-serif'}}>({cart.reduce((s,i)=>s+i.qty,0)} items)</span></h2>
        <button onClick={onClose} style={{background:'none',border:'none',cursor:'pointer',color:'var(--warm-gray)'}}><IcoX style={{width:20,height:20}}/></button></div>
      {cart.length===0?(<div style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:32,gap:16}}>
        <span style={{fontSize:48}}>🛍</span><p style={{fontFamily:'Cormorant Garamond,serif',fontSize:22,fontWeight:500}}>Your bag is empty</p>
        <a href="#/sarees" onClick={onClose} className="btn-terra">Explore Sarees</a></div>):(
        <><div className="cart-items">{cart.map(item=>(
          <div key={item.id+'-'+item.size} className="cart-item">
            <a href={'#/product/'+item.id} onClick={onClose} style={{display:'block',flexShrink:0}} aria-label={item.name}>
              <img src={item.images[0]} alt={item.name} className="cart-item-img" onError={handleImgError}/>
            </a>
            <div className="cart-item-info">
              <a href={'#/product/'+item.id} onClick={onClose} style={{textDecoration:'none',color:'inherit'}}><p className="cart-item-name">{item.name}</p></a>
              <p className="cart-item-meta">{item.size?'Size: '+item.size+' · ':''}{item.fabric}</p>
              <p className="cart-item-price">{fmt(item.price)}</p>
              <div className="cart-qty">
                <button onClick={()=>updateQty(item.id,item.size,item.qty-1)}>−</button>
                <span>{item.qty}</span>
                <button onClick={()=>updateQty(item.id,item.size,item.qty+1)}>+</button>
              </div>
            </div>
            <button className="cart-remove" onClick={()=>removeFromCart(item.id,item.size)}><IcoTrash style={{width:16,height:16}}/></button>
          </div>
        ))}</div>
        <div className="cart-footer">
          <p className="cart-free-ship">🚚 Free delivery on orders above ₹999</p>
          <div className="cart-summary-row"><span>Subtotal</span><span>{fmt(sub)}</span></div>
          <div className="cart-summary-row"><span>Discount</span><span className="green">− {fmt(disc)}</span></div>

          </div>
        </div></>
      )}
    </div>
  </>);

function ProductListingPage({category,products,wishlist,toggleWishlist,addToCart}){
  const [sort,setSort]=useState('recommended');
  const [openFilter,setOpenFilter]=useState(null);
  const [filters,setFilters]=useState({});
  const cats=products.filter(p=>p.category===category);
  const fabrics=[...new Set(cats.map(p=>p.fabric))];
  const colors=[...new Set(cats.map(p=>p.color))];
  const occasions=[...new Set(cats.map(p=>p.occasion))];
  const tog=(k,v)=>setFilters(f=>{const a=f[k]||[];return{...f,[k]:a.includes(v)?a.filter(x=>x!==v):[...a,v]};});
  const filtered=useMemo(()=>{
    let a=[...cats];
    if(filters.maxPrice)a=a.filter(p=>p.price<=filters.maxPrice);
    if(filters.fabrics?.length)a=a.filter(p=>filters.fabrics.includes(p.fabric));
    if(filters.colors?.length)a=a.filter(p=>filters.colors.includes(p.color));
    if(filters.occasions?.length)a=a.filter(p=>filters.occasions.some(o=>p.occasion.includes(o)));
    if(filters.sizes?.length&&category==='Salwars')a=a.filter(p=>filters.sizes.some(s=>p.sizes.includes(s)));
    if(filters.discounts?.length)a=a.filter(p=>filters.discounts.some(d=>p.discount>=d));
    if(sort==='price-asc')a=a.sort((x,y)=>x.price-y.price);
    else if(sort==='price-desc')a=a.sort((x,y)=>y.price-x.price);
    else if(sort==='discount')a=a.sort((x,y)=>y.discount-x.discount);
    else if(sort==='rating')a=a.sort((x,y)=>y.rating-x.rating);
    else if(sort==='newest')a=[...a.filter(p=>p.isNew),...a.filter(p=>!p.isNew)];
    return a;
  },[cats,filters,sort,category]);
  const fds=[
    {key:'price',label:'Price',content:(<div style={{padding:'8px 0'}}><div style={{display:'flex',justifyContent:'space-between',fontSize:12,color:'var(--warm-gray)',marginBottom:10}}><span>₹0</span><span>{fmt(filters.maxPrice||5000)}</span></div><input type="range" min={0} max={5000} step={100} value={filters.maxPrice||5000} onChange={e=>setFilters(f=>({...f,maxPrice:Number(e.target.value)}))}/></div>)},
    {key:'fabric',label:'Fabric',options:fabrics,fk:'fabrics'},{key:'color',label:'Color',options:colors,fk:'colors'},
    ...(category==='Salwars'?[{key:'size',label:'Size',options:['S','M','L','XL','XXL'],fk:'sizes'}]:[]),
    {key:'occasion',label:'Occasion',options:occasions,fk:'occasions'},
    {key:'discount',label:'Discount',content:(<div>{[20,25,30].map(d=><label key={d} style={{display:'flex',alignItems:'center',gap:10,fontSize:13,color:'var(--mid-gray)',padding:'6px 0',cursor:'pointer'}}><input type="checkbox" style={{accentColor:'var(--terracotta)',width:14,height:14}} checked={(filters.discounts||[]).includes(d)} onChange={()=>tog('discounts',d)}/> {d}% &amp; above</label>)}</div>)},
  ];
  return(<div className="listing-page page-fade">
    <div className="listing-header"><div><p className="section-eyebrow">Collection</p><h1 className="section-title-xl">{category==='Sarees'?'Sarees':'Salwar Suits'}</h1><p style={{fontSize:14,color:'var(--warm-gray)',marginTop:6}}>{filtered.length} products</p></div>
      <select className="sort-select" value={sort} onChange={e=>setSort(e.target.value)}><option value="recommended">Sort: Recommended</option><option value="newest">Newest</option><option value="price-asc">Price: Low to High</option><option value="price-desc">Price: High to Low</option><option value="discount">Highest Discount</option><option value="rating">Popularity</option></select>
    </div>
    <div className="horizontal-filter-bar" onClick={e=>e.stopPropagation()}>
      {fds.map(fd=>{const isO=openFilter===fd.key;return(<div key={fd.key} className="filter-pill">
        <button className={'filter-pill-btn'+(isO?' open':'')} onClick={()=>setOpenFilter(isO?null:fd.key)}>{fd.label}<IcoChevDown style={{width:14,height:14}}/></button>
        {isO&&<div className="filter-dropdown">{fd.content?fd.content:fd.options.map(opt=><label key={opt} style={{display:'flex',alignItems:'center',gap:10,fontSize:13,color:'var(--mid-gray)',padding:'6px 0',cursor:'pointer'}}><input type="checkbox" style={{accentColor:'var(--terracotta)',width:14,height:14}} checked={(filters[fd.fk]||[]).includes(opt)} onChange={()=>tog(fd.fk,opt)}/>{opt}</label>)}</div>}
      </div>);})}
      <button className="filter-clear" onClick={()=>{setFilters({});setOpenFilter(null);}}>Clear All</button>
      <span className="filter-count">{filtered.length} results</span>
    </div>
    {filtered.length===0?(<div className="empty-state"><div className="empty-state-icon">🔍</div><h2>No products found</h2><p>Try adjusting your filters.</p><button className="btn-terra" onClick={()=>setFilters({})}>Clear Filters</button></div>):(
      <div className="product-grid-v2">{filtered.map(p=><GridCard key={p.id} product={p} wishlist={wishlist} toggleWishlist={toggleWishlist} addToCart={addToCart}/>)}</div>
    )}
  </div>);
}

function CartPage({cart,updateQty,removeFromCart}){

  if(!cart.length)return(<div className="empty-state page-fade"><div className="empty-state-icon">🛍</div><h2>Your Bag is Empty</h2><p>Add some beautiful sarees or salwar sets to get started.</p><a href="#/sarees" className="btn-terra">Shop Sarees</a></div>);

        <a href={'#/product/'+item.id}><img src={item.images[0]} alt={item.name} style={{width:100,height:125,objectFit:'cover',objectPosition:'top',background:'var(--beige)'}} onError={handleImgError}/></a>
        <div><a href={'#/product/'+item.id} style={{textDecoration:'none'}}><p style={{fontFamily:'Cormorant Garamond,serif',fontSize:18,fontWeight:500,marginBottom:4}}>{item.name}</p></a>
          {item.size&&<p style={{fontSize:12,color:'var(--warm-gray)',marginBottom:4}}>Size: <strong>{item.size}</strong></p>}
          <p style={{fontSize:12,color:'var(--warm-gray)',marginBottom:12}}>{item.fabric}</p>
          <div className="qty-control"><button onClick={()=>updateQty(item.id,item.size,item.qty-1)}>−</button><span>{item.qty}</span><button onClick={()=>updateQty(item.id,item.size,item.qty+1)}>+</button></div>
        </div>
        <div style={{textAlign:'right'}}><p style={{fontFamily:'Cormorant Garamond,serif',fontSize:22,fontWeight:600,color:'var(--terracotta)'}}>{fmt(item.price*item.qty)}</p><p style={{fontSize:12,textDecoration:'line-through',color:'var(--warm-gray)'}}>{fmt(item.originalPrice*item.qty)}</p><button style={{marginTop:8,background:'none',border:'none',cursor:'pointer',color:'var(--warm-gray)'}} onClick={()=>removeFromCart(item.id,item.size)}><IcoTrash style={{width:16,height:16}}/></button></div>
      </div>)}</div>
      <div style={{background:'var(--white)',border:'1px solid var(--sand)',padding:24,position:'sticky',top:88}}>
        <h3 style={{fontSize:10,letterSpacing:'.18em',textTransform:'uppercase',fontWeight:700,marginBottom:16,paddingBottom:12,borderBottom:'1px solid var(--sand)'}}>Order Summary</h3>
        <div style={{display:'flex',justifyContent:'space-between',fontSize:13,marginBottom:8,color:'var(--warm-gray)'}}><span>Subtotal</span><span>{fmt(sub)}</span></div>
        <div style={{display:'flex',justifyContent:'space-between',fontSize:13,marginBottom:8,color:'#3a7d44'}}><span>Discount</span><span>− {fmt(disc)}</span></div>
        <div style={{display:'flex',justifyContent:'space-between',fontSize:13,marginBottom:16}}><span style={{color:'var(--warm-gray)'}}>Delivery</span><span className={del===0?'green':''}>{del===0?'FREE':fmt(del)}</span></div>
        <div style={{display:'flex',justifyContent:'space-between',fontSize:16,fontWeight:700,borderTop:'1px solid var(--sand)',paddingTop:12,marginBottom:20}}><span>Total</span><span style={{color:'var(--terracotta)'}}>{fmt(sub+del)}</span></div>
        <a href="#/checkout" className="btn-terra btn-full">Proceed to Checkout</a>

function App(){
  const [cart,setCart]=useState([]);
  const [wishlist,setWishlist]=useState([]);
  const [toasts,setToasts]=useState([]);
  const [page,setPage]=useState(window.location.hash||'#/');
  const [searchQuery,setSearchQuery]=useState('');
  const [searchOpen,setSearchOpen]=useState(false);
  const [cartOpen,setCartOpen]=useState(false);
  useEffect(()=>{const h=()=>{setPage(window.location.hash||'#/');window.scrollTo(0,0);};window.addEventListener('hashchange',h);return()=>window.removeEventListener('hashchange',h);},[]);
  const toast=(msg)=>{const id=Date.now();setToasts(t=>[...t,{id,msg}]);};
  const addToCart=useCallback((product,size)=>{setCart(c=>{const k=product.id+'-'+size;const ex=c.find(i=>i.id+'-'+i.size===k);if(ex){toast('Updated bag');return c.map(i=>i.id+'-'+i.size===k?{...i,qty:i.qty+1}:i);}toast('Added to bag');return[...c,{...product,size,qty:1}];});setCartOpen(true);},[]);
  const updateQty=useCallback((id,size,qty)=>{if(qty<1){setCart(c=>c.filter(i=>!(i.id===id&&i.size===size)));toast('Removed from bag');return;}setCart(c=>c.map(i=>i.id===id&&i.size===size?{...i,qty}:i));},[]);
  const removeFromCart=useCallback((id,size)=>{setCart(c=>c.filter(i=>!(i.id===id&&i.size===size)));toast('Removed from bag');},[]);
  const toggleWishlist=useCallback((id)=>{setWishlist(w=>{if(w.includes(id)){toast('Removed from wishlist');return w.filter(x=>x!==id);}toast('Added to wishlist ♡');return[...w,id];});},[]);
  const hash=page;
  const render=()=>{
    if(hash==='#/'||hash==='')return<HomePage products={ALL_PRODUCTS} wishlist={wishlist} toggleWishlist={toggleWishlist} addToCart={addToCart}/>;
    if(hash==='#/sarees')return<ProductListingPage category="Sarees" products={ALL_PRODUCTS} wishlist={wishlist} toggleWishlist={toggleWishlist} addToCart={addToCart}/>;
    if(hash==='#/salwars')return<ProductListingPage category="Salwars" products={ALL_PRODUCTS} wishlist={wishlist} toggleWishlist={toggleWishlist} addToCart={addToCart}/>;
    if(hash==='#/new-arrivals')return<FilteredPage title="New Arrivals" sub="Just In" products={ALL_PRODUCTS} filter="new" wishlist={wishlist} toggleWishlist={toggleWishlist} addToCart={addToCart}/>;
    if(hash==='#/best-sellers')return<FilteredPage title="Best Sellers" sub="Most Loved" products={ALL_PRODUCTS} filter="best" wishlist={wishlist} toggleWishlist={toggleWishlist} addToCart={addToCart}/>;
    if(hash==='#/offers')return<FilteredPage title="Special Offers" sub="Up to 29% Off" products={ALL_PRODUCTS} filter="offers" wishlist={wishlist} toggleWishlist={toggleWishlist} addToCart={addToCart}/>;
    if(hash==='#/cart')return<CartPage cart={cart} updateQty={updateQty} removeFromCart={removeFromCart}/>;
    if(hash==='#/checkout')return<CheckoutPage cart={cart}/>;
    if(hash==='#/wishlist')return<WishlistPage wishlist={wishlist} products={ALL_PRODUCTS} toggleWishlist={toggleWishlist} addToCart={addToCart}/>;
    if(hash==='#/search')return<SearchPage query={searchQuery} products={ALL_PRODUCTS} wishlist={wishlist} toggleWishlist={toggleWishlist} addToCart={addToCart}/>;
    if(hash==='#/size-guide')return<SizeGuidePage/>;
    if(hash==='#/contact')return<ContactPage/>;
    const m=hash.match(/^#\/product\/(\d+)$/);
    if(m){const p=ALL_PRODUCTS.find(x=>x.id===Number(m[1]));if(p)return<ProductDetailPage product={p} wishlist={wishlist} toggleWishlist={toggleWishlist} addToCart={addToCart}/>;} 
    return<div className="empty-state page-fade"><div className="empty-state-icon">404</div><h2>Page Not Found</h2><p>The page you're looking for doesn't exist.</p><a href="#/" className="btn-terra">Back to Home</a></div>;
  };
  return(<div style={{minHeight:'100vh',display:'flex',flexDirection:'column'}}>
    <Header cart={cart} wishlist={wishlist} onSearch={()=>setSearchOpen(true)} onCartOpen={()=>setCartOpen(true)}/>
    <main style={{flex:1}}>{render()}</main>
    <Footer/>
    {searchOpen&&<SearchOverlay onClose={()=>setSearchOpen(false)} onSearch={(q)=>{setSearchQuery(q);window.location.hash='#/search';}}/>}
    {cartOpen&&<CartDrawer cart={cart} updateQty={updateQty} removeFromCart={removeFromCart} onClose={()=>setCartOpen(false)}/>}
    <MobileBottomNav page={page} wishlist={wishlist} cart={cart} onCartOpen={()=>setCartOpen(true)}/>
    {toasts.slice(-1).map(t=><Toast key={t.id} message={t.msg} onDone={()=>setToasts(ts=>ts.filter(x=>x.id!==t.id))}/>)}
  </div>);
}

function MobileBottomNav({page,wishlist,cart,onCartOpen}){
  const isDetail=page.startsWith('#/product/');
  if(isDetail)return null;
  const wc=wishlist.length;
  const cc=cart.reduce((s,i)=>s+i.qty,0);
  return(
    <nav className="mobile-bottom-nav">
      <a href="#/" className={page==='#/'||page===''?'active':''}>
        <span className="mbn-icon"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span>
        <span>Home</span>
      </a>
      <a href="#/sarees" className={page==='#/sarees'?'active':''}>
        <span className="mbn-icon"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18"/><path d="M3 12h18"/></svg></span>
        <span>Sarees</span>
      </a>
      <a href="#/salwars" className={page==='#/salwars'?'active':''}>
        <span className="mbn-icon"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg></span>
        <span>Salwars</span>
      </a>
      <a href="#/wishlist" className={page==='#/wishlist'?'active':''}>
        <span className="mbn-icon"><IcoHeart style={{width:20,height:20}} filled={wc>0}/></span>
        <span>Wishlist</span>
        {wc>0&&<span className="mbn-badge">{wc}</span>}
      </a>
      <button onClick={onCartOpen} aria-label="Shopping Bag">
        <span className="mbn-icon"><IcoBag style={{width:20,height:20}}/></span>
        <span>Bag</span>
        {cc>0&&<span className="mbn-badge">{cc}</span>}
      </button>
    </nav>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
